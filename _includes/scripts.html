<script type="text/javascript" src="/assets/js/main.js"></script>
{% include disqus-scripts.html %}

{% if page.extra_scripts %}
  {% for script in page.extra_scripts %}
    <script type="text/javascript" src="{{ script }}"></script>
  {% endfor %}
{% endif %}

<script>
(function() {
  var gitissueAPI = 'https://api.github.com/search/issues?q=state:open+repo:anuragjain67/anuragjain67.github.io+label:"new blog"';
  $.getJSON( gitissueAPI, {
    sort: "created",
    order: "asc"
  })
    .done(function( data ) {
      $.each( data.items, function( i, item ) {
        $( "#upcomingposts" ).append( i+1 + ".  " + item.title + "<br>");
      });
    });
})();
</script>
